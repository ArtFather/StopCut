# Builds StopCut.exe and publishes it as a GitHub release: run it from the Actions tab with a version
# (v1.0, v1.1, ...), or push a version tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build StopCut.exe
        run: >
          dotnet publish StopCut/StopCut.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path publish/StopCut.exe -DestinationPath "StopCut-$env:VERSION-win-x64.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >
          gh release create "$env:VERSION" "StopCut-$env:VERSION-win-x64.zip" --target "${{ github.sha }}"
          --title "StopCut $env:VERSION" --notes-file .github/release-notes.md
